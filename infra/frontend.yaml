AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Meetings App - frontend (static SPA) in a private S3 bucket served by CloudFront on the flat-rate
  Free plan, optionally on a custom domain. Deploy in us-east-1: CloudFront only accepts ACM certificates
  and CLOUDFRONT-scope WAF web ACLs from there.

Parameters:
  ProjectName:
    Type: String
    Default: meetings
    Description: Name prefix for all resources.
  PricingPlan:
    Type: String
    Default: FREE
    AllowedValues: [FREE, PAY_AS_YOU_GO]
    Description: >-
      FREE subscribes the distribution to the CloudFront flat-rate Free plan ($0/month, no overage charges;
      at most 3 per account, not available to accounts on the AWS Free Tier). PAY_AS_YOU_GO skips it.
  RateLimitPerIp:
    Type: Number
    Default: 2000
    MinValue: 10
    Description: Requests per IP per 5 minutes before the WAF blocks it (blocked requests don't count toward the plan).
  CertificateArn:
    Type: String
    Default: ""
    Description: Optional ACM certificate (us-east-1) for DomainName; set both to serve the site on a custom domain.
  DomainName:
    Type: String
    Default: ""
    Description: Optional custom domain for the site (e.g. app.example.com).
  HostedZoneId:
    Type: String
    Default: ""
    Description: Optional Route 53 public hosted zone of DomainName; when set, alias records to CloudFront are created.

Conditions:
  UseCustomDomain: !And
    - !Not [!Equals [!Ref CertificateArn, ""]]
    - !Not [!Equals [!Ref DomainName, ""]]
  CreateDnsRecords: !And [!Condition UseCustomDomain, !Not [!Equals [!Ref HostedZoneId, ""]]]
  UseFreePlan: !Equals [!Ref PricingPlan, FREE]

Mappings:
  CloudFront:
    Global:
      # Fixed hosted zone of every CloudFront distribution (for Route 53 alias records).
      HostedZoneId: Z2FDTNDATAQYW2
      # Managed cache policy "CachingOptimized".
      CachingOptimized: 658327ea-f89d-4fab-a63d-7e88639e58f6

Resources:
  # Private: only CloudFront (via Origin Access Control) can read it.
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${ProjectName}-frontend-${AWS::StackName}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Required by flat-rate plans (the Free plan allows 5 rules and no custom rule groups); its requests are
  # covered by the plan. It must belong to this distribution only. Not created on pay-as-you-go, where a
  # web ACL would cost about $5/month plus $1 per rule.
  WebAcl:
    Type: AWS::WAFv2::WebACL
    Condition: UseFreePlan
    Properties:
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName
      Name: !Sub ${ProjectName}-frontend-${AWS::StackName}
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub ${ProjectName}-frontend
      Rules:
        - Name: rate-limit-per-ip
          Priority: 0
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: !Ref RateLimitPerIp
              EvaluationWindowSec: 300
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: rate-limit-per-ip

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName
      DistributionConfig:
        Comment: !Sub ${ProjectName} frontend
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        # Flat-rate plans serve from every edge location; PriceClass_All is also the pay-as-you-go default.
        PriceClass: PriceClass_All
        WebACLId: !If [UseFreePlan, !GetAtt WebAcl.Arn, !Ref AWS::NoValue]
        DefaultRootObject: index.html
        Aliases: !If [UseCustomDomain, [!Ref DomainName], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - UseCustomDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: !FindInMap [CloudFront, Global, CachingOptimized]
        # Single-page app: unknown paths (S3 answers 403 without ListBucket) render index.html.
        CustomErrorResponses:
          - { ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 404, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 0 }

  # $0/month flat-rate plan for the distribution and its web ACL, activated immediately (only paid tiers need
  # approval). Referencing both makes CloudFormation create it last and cancel it first on delete, since a
  # subscribed distribution can't be deleted. Not taggable.
  # FreePlanSubscription:
  #   Type: AWS::PricingPlanManager::Subscription
  #   Condition: UseFreePlan
  #   Properties:
  #     PlanFamily: CloudFront
  #     PlanTier: FREE
  #     UsageLevel: DEFAULT
  #     ResourceArns:
  #       - !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}
  #       - !GetAtt WebAcl.Arn

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFrontRead
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  DnsRecordIpv4:
    Type: AWS::Route53::RecordSet
    Condition: CreateDnsRecords
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: !FindInMap [CloudFront, Global, HostedZoneId]
        EvaluateTargetHealth: false

  DnsRecordIpv6:
    Type: AWS::Route53::RecordSet
    Condition: CreateDnsRecords
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: !FindInMap [CloudFront, Global, HostedZoneId]
        EvaluateTargetHealth: false

Outputs:
  SiteUrl:
    Description: Public URL of the frontend.
    Value: !If
      - UseCustomDomain
      - !Sub "https://${DomainName}"
      - !Sub "https://${Distribution.DomainName}"
  SiteOrigins:
    Description: Comma-separated browser origins of the site (added to the backend's CORS origins).
    Value: !If
      - UseCustomDomain
      - !Sub "https://${Distribution.DomainName},https://${DomainName}"
      - !Sub "https://${Distribution.DomainName}"
  DistributionDomain:
    Description: Point a CNAME for the custom domain here when DNS is not in Route 53.
    Value: !GetAtt Distribution.DomainName
  DistributionId:
    Value: !Ref Distribution
  # PricingPlan:
  #   Description: CloudFront pricing of the distribution.
  #   Value: !If [UseFreePlan, !Sub "FREE (${FreePlanSubscription.Status})", PAY_AS_YOU_GO]
  BucketName:
    Value: !Ref SiteBucket
